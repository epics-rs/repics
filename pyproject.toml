[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "repics"
description = "EPICS Channel Access and pvAccess for Python, built on epics-rs"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Sang Woo Kim", email = "sngwkim915@gmail.com" }]
dynamic = ["version"]
dependencies = ["numpy>=1.22"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.urls]
Source = "https://github.com/epics-rs/repics"

[tool.maturin]
python-source = "python"
module-name = "repics._repics"
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Duplicate test basenames (tests/ca/test_server.py, tests/pva/test_server.py)
# collide under the default prepend import mode; importlib keys by full path.
addopts = "--import-mode=importlib"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# A correctness gate, not a style rewrite: pyflakes (F), the E4/E7/E9 pycodestyle
# subset, and blind-except (BLE). pep8-naming (N) and flake8-builtins (A) are off
# on purpose — the p4p-shaped API (isOpen, getID, the Value locals V/W, and the
# format=/type=/id= keyword arguments) is deliberate and those rules would fight
# it. E501 line length is off too; some signatures stay long.
select = ["E4", "E7", "E9", "F", "BLE"]
