[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "epicsrs"
description = "EPICS Channel Access and pvAccess for Python, built on epics-rs"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Sang Woo Kim", email = "sngwkim915@gmail.com" }]
dynamic = ["version"]
dependencies = ["numpy>=1.22"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.urls]
Source = "https://github.com/epics-rs/epicsrs"

[tool.maturin]
python-source = "python"
module-name = "epicsrs._epicsrs"
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
testpaths = ["tests"]
