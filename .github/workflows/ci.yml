name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  # repics depends on ../epics-rs by path; CI checks epics-rs out at this
  # ref beside it and builds softioc-rs from that tree. Bump in lockstep
  # with the epics-rs version Cargo.lock pins.
  EPICS_RS_REF: v0.29.2

jobs:
  # Strict lint gate on the canonical target only, as epics-rs does:
  # clippy -D warnings and fmt run once on Linux x86_64 rather than
  # multiplying platform-specific lint noise across the matrix.
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: repics
    steps:
      - uses: actions/checkout@v4
        with:
          path: repics
      - uses: actions/checkout@v4
        with:
          repository: epics-rs/epics-rs
          ref: ${{ env.EPICS_RS_REF }}
          path: epics-rs
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            repics
            epics-rs
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings

  # Build the extension and run the Python suite on all three OSes. One
  # cell failing does not cancel the others (fail-fast: false), so each
  # reports portability on its own.
  test:
    name: test-${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
          - name: macos
            os: macos-latest
          - name: windows
            os: windows-latest
    defaults:
      run:
        shell: bash
        working-directory: repics
    steps:
      - uses: actions/checkout@v4
        with:
          path: repics
      - uses: actions/checkout@v4
        with:
          repository: epics-rs/epics-rs
          ref: ${{ env.EPICS_RS_REF }}
          path: epics-rs
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            repics
            epics-rs
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve the epics-rs commit
        id: epics-rs
        run: echo "sha=$(git -C ../epics-rs rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Cache softioc-rs
        id: ioc-cache
        uses: actions/cache@v4
        with:
          path: epics-rs/target/release/softioc-rs${{ runner.os == 'Windows' && '.exe' || '' }}
          key: softioc-rs-${{ steps.epics-rs.outputs.sha }}-${{ runner.os }}
      - name: Build softioc-rs
        if: steps.ioc-cache.outputs.cache-hit != 'true'
        run: cargo build --release --manifest-path ../epics-rs/crates/epics-ca-rs/Cargo.toml --bin softioc-rs

      - name: Install build/test tools
        run: pip install maturin pytest numpy
      # p4p is the reference peer for the pva interop tests. It has no
      # Windows wheels (and no arm64 macOS wheels on some releases); where
      # it will not install, those tests skip via pytest.importorskip.
      - name: Install p4p (reference peer, best effort)
        continue-on-error: true
        run: pip install p4p
      - name: Build and install the wheel
        run: |
          maturin build --release --out dist
          pip install --no-index --find-links dist repics
      - name: pytest
        run: pytest -v
        env:
          REPICS_SOFTIOC: ${{ github.workspace }}/epics-rs/target/release/softioc-rs${{ runner.os == 'Windows' && '.exe' || '' }}

  # Prove a release wheel builds on each OS. Native host build (not the
  # manylinux container) so the ../epics-rs path dependency resolves.
  wheels:
    needs: [lint, test]
    name: wheel-${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
          - name: macos
            os: macos-latest
          - name: windows
            os: windows-latest
    defaults:
      run:
        shell: bash
        working-directory: repics
    steps:
      - uses: actions/checkout@v4
        with:
          path: repics
      - uses: actions/checkout@v4
        with:
          repository: epics-rs/epics-rs
          ref: ${{ env.EPICS_RS_REF }}
          path: epics-rs
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install maturin
      - run: maturin build --release --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.name }}
          path: repics/dist
