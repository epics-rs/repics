name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  EPICS_RS_VERSION: "0.28.1"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache softioc-rs
        id: ioc-cache
        uses: actions/cache@v4
        with:
          path: ioc-bin
          key: softioc-rs-${{ env.EPICS_RS_VERSION }}-${{ runner.os }}
      - name: Build softioc-rs
        if: steps.ioc-cache.outputs.cache-hit != 'true'
        run: cargo install epics-ca-rs --version ${{ env.EPICS_RS_VERSION }} --bin softioc-rs --root ioc-bin

      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: pip install maturin pytest numpy
      - run: maturin develop --release
      - run: pytest -v
        env:
          EPICSRS_SOFTIOC: ${{ github.workspace }}/ioc-bin/bin/softioc-rs

  wheels:
    needs: test
    strategy:
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: PyO3/maturin-action@v1
        with:
          args: --release --out dist
          manylinux: "2_28"
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: dist
